spring.application.name=twiniq-backend

# Server Configuration (PaaS / Docker dynamic port support)
server.port=${PORT:8081}

# PostgreSQL Datasource (Configurable via standard environment variables)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/twiniq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP production defaults)
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.pool-name=TwinIQHikariCP

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# Actuator Health Checks (Used for container / cloud liveness and readiness probes)
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# JWT Security Configuration
twiniq.jwt.secret=${JWT_SECRET:TwinIQ2026SuperSecureSecretKeyForCognitiveBusinessTwinPlatformMustBe256BitsLong!}
twiniq.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Dynamic CORS Allowed Origins (Comma-separated list, patterns supported)
twiniq.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}