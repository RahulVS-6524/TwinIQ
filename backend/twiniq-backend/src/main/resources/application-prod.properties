# TwinIQ Production Profile Configuration
# Active when SPRING_PROFILES_ACTIVE=prod or --spring.profiles.active=prod

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=update

# Logging levels in production
logging.level.root=INFO
logging.level.com.twiniq=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=WARN

# Connection Pool for production
spring.datasource.hikari.maximum-pool-size=${HIKARI_MAX_POOL_SIZE:15}
spring.datasource.hikari.minimum-idle=${HIKARI_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000
